name: Build and Push Docker Images

on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'Kubectl version to publish. --- Pattern: X.XX --- See in https://kubernetes.io/releases/'
        required: true
        type: string
      push_latest:
        description: 'Should publish "latest" image tag?'
        required: true
        default: false
        type: choice
        options:
          - true
          - false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: "Build e Push image ${{ inputs.version }} - push_latest: ${{ inputs.push_latest }}"
        uses: docker/build-push-action@v5
        with:
          context: ./generic
          file: ./generic/Dockerfile
          push: true
          build-args: "KUBECTL_VERSION=${{ inputs.version }}"
          tags: |
            fabionaspolini/kubectl:${{ inputs.version }}
            ${{ matrix.version.push_latest && 'fabionaspolini/kubectl:latest' || '' }}
