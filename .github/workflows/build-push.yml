name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version:
          - version: '1.35'
            specific_tag: '1.35.2'
            push_latest: true
#          - version: '1.21'
#            specific_tag: '1.21.3'
#            push_latest: false
#          - version: '1.20'
#            specific_tag: '1.20.9'
#            push_latest: false
#          - version: '1.19'
#            specific_tag: '1.19.3'
#            push_latest: false

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push imagem ${{ matrix.version.version }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.version.version }}
          file: ./${{ matrix.version.version }}/Dockerfile
          push: true
          tags: |
            fabionaspolini/kubectl:${{ matrix.version.specific_tag }}
            fabionaspolini/kubectl:${{ matrix.version.version }}
            ${{ matrix.version.push_latest && 'fabionaspolini/kubectl:latest' || '' }}

