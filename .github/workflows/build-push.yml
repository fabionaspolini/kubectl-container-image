name: Build and push docker images

on:
  workflow_dispatch: &workflow_dispatch_inputs
    inputs:
      version:
        description: 'Kubectl version to publish, pattern: X.XX ➡️ See in https://kubernetes.io/releases/'
        required: true
        type: string
      push_latest:
        description: 'Should publish "latest" image tag?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  workflow_call:
    inputs: *workflow_dispatch_inputs

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_call'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: "Build e Push image ${{ inputs.version }} - push_latest: ${{ inputs.push_latest }}"
        uses: docker/build-push-action@v5
        with:
          context: ./generic
          file: ./generic/Dockerfile
          push: true
          build-args: "KUBECTL_VERSION=${{ inputs.version }}"
          tags: |
            fabionaspolini/kubectl:${{ inputs.version }}
            ${{ inputs.push_latest == 'true' && 'fabionaspolini/kubectl:latest' || '' }}
